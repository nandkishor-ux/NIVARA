<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NIVARA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if current_student %}
        <a href="{{ url_for('profile') }}" class="user-avatar" title="My profile">
            <span class="user-avatar-initial">{{ (current_student.display_name or 'N')[:1] | upper }}</span>
        </a>
    {% endif %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
